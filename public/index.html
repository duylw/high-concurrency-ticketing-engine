<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nền tảng săn vé sự kiện và mở bán Flash-Sale hiệu năng cao, chống quá tải với kiến trúc Redis Cache-Aside và PostgreSQL ACID.">
  <meta name="theme-color" content="#07090E">
  <title>Ticketing Engine | Nền Tảng Săn Vé & Quản Lý Sự Kiện</title>
  
  <!-- Favicon placeholder with SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366F1'/><text y='.9em' font-size='70' x='15' fill='white'>⚡</text></svg>">
  
  <!-- Master Design System Stylesheet -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- 1. Global Navigation Bar -->
  <header class="navbar" id="navbar-root">
    <div class="container navbar-inner">
      <a href="/" class="navbar-brand">
        <div class="brand-icon">⚡</div>
        <span>TICKET<span class="text-gradient-brand">FLOW</span></span>
      </a>

      <nav class="navbar-nav">
        <a href="#events" class="nav-link is-active">Sự Kiện</a>
      </nav>

      <div class="navbar-actions" id="navbar-actions">
        <!-- Default Public Buttons (Replaced reactively by navbar module) -->
        <button class="btn btn-ghost btn-sm" id="btn-login-trigger">Đăng Nhập</button>
        <button class="btn btn-primary btn-sm" id="btn-register-trigger">Đăng Ký</button>
      </div>
    </div>
  </header>

  <!-- 2. Main Application Container -->
  <main id="app">
    <!-- Hero Section -->
    <section class="section">
      <div class="container text-center" style="max-width: 860px; margin: 0 auto; text-align: center;">
        <h1 style="margin-bottom: 1.25rem;">
          Săn Vé Sự Kiện Trực Tuyến <br>
          <span class="text-gradient-brand">Tốc Độ Cao & Công Bằng</span>
        </h1>
        
        <p class="text-lead" style="margin-bottom: 2.25rem;">
          Nền tảng đặt vé hòa nhạc và sự kiện trực tiếp hàng đầu. Trải nghiệm săn vé mượt mà, minh bạch và an toàn tuyệt đối.
        </p>

        <div class="flex items-center justify-center gap-4 flex-wrap">
          <a href="#events" class="btn btn-primary btn-lg">Khám Phá Sự Kiện</a>
        </div>
      </div>
    </section>
  </main>

  <!-- 3. Global Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- 4. Global Modal Root Container -->
  <div id="modal-root"></div>

  <!-- Vendor Libraries for Universal WebRTC QR Code Engine (Global CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- Master JavaScript Application (ES Modules Native) -->
  <script type="module" src="/js/app.js"></script>

  <!-- Fallback Initial Click Handlers -->
  <script type="module">
    import { authModal } from '/js/modules/auth/auth.modal.js';

    document.getElementById('btn-login-trigger')?.addEventListener('click', () => {
      authModal.open('login');
    });

    document.getElementById('btn-register-trigger')?.addEventListener('click', () => {
      authModal.open('register');
    });
  </script>
</body>
</html>
