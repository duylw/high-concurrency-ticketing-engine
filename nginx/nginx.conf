worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==========================================================================
    # 1. Gzip Compression (Speed & Bandwidth Optimization)
    # ==========================================================================
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # ==========================================================================
    # 2. Rate Limiting Zone (Anti-DDoS & Flash-Sale Traffic Shaping)
    # 30 requests per second per IP with a burst buffer of 50
    # ==========================================================================
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_status 429;

    # ==========================================================================
    # 3. Docker Internal DNS Resolver (Dynamic Container IP Resolution)
    # ==========================================================================
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ==========================================================================
    # 4. Upstream Clusters (Decoupled Headless API & Web SPA)
    # ==========================================================================
    upstream backend_cluster {
        server api:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_cluster {
        server web:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen 443 ssl default_server;
        server_name _;

        # SSL Configuration (Self-signed or CA certs)
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        # ======================================================================
        # 4. OWASP Recommended Security Headers
        # ======================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;

        # Common Proxy Headers for Express behind reverse proxy
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ======================================================================
        # 5. API Endpoints (Protected by Rate Limiting)
        # ======================================================================
        location /api/ {
            limit_req zone=api_rate_limit burst=50 nodelay;
            proxy_pass http://backend_cluster;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ======================================================================
        # 6. Frontend Static Assets & SPA Client-Side Routing
        # ======================================================================
        location / {
            proxy_pass http://frontend_cluster;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
